[project]
name = "lead-integrity"
version = "0.1.0"
description = "Record-level reconciliation between a lead source and a CRM: did every lead arrive, and can you prove it?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ramon Chacal" }]
requires-python = ">=3.12"
dependencies = ["phonenumbers>=8.13"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_integrity"]

[tool.pytest.ini_options]
pythonpath = ["tests", "scripts"]
testpaths = ["tests"]
