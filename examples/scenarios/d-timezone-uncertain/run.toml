# Scenario d-timezone-uncertain. Generated by scripts/generate_examples.py; do not edit by hand.

[files]
source = "source.csv"
destination = "destination.csv"

[settings]
as_of = "2026-10-04T17:00:00+00:00"
late_after_minutes = 30
grace_period_minutes = 120
systemic_threshold = 0.9
destination_scope_is_pipeline_specific = true

[timezone_check]
min_pairs = 10
min_share = 0.8
tolerance_minutes = 15

[exclusions]
form_ids = []
lead_ids = []

[source]
timezone = "UTC"
default_region = "US"

[source.columns]
