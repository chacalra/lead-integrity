created_at = "created_time"
email = "email"
phone = "phone_number"
full_name = "full_name"
form_id = "form_id"
campaign_id = "campaign_id"
campaign_name = "campaign_name"
adset_id = "adset_id"
ad_id = "ad_id"
is_organic = "is_organic"

[destination]
timezone = "UTC"
default_region = "US"

[destination.columns]
record_id = "Record ID"
created_at = "Create Date"
email = "Email"
additional_emails = "Additional email addresses"
phone = "Phone Number"
source_lead_ids = "Meta Lead ID"
campaign_id = "Campaign ID"
campaign_name = "Campaign Name"

[report]
title = "D. Timezone uncertainty"
description = "The CRM exports local time (US Central), but the configuration declares it as UTC. Every pair differs by about 5 hours. Nothing is corrected: time-based conclusions are switched off, and leads that were not found stay undecided, whatever their age."
